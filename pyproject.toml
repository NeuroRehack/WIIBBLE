[project]
name = "wiibble"
version = "2.1.0"
description = "Wii Balance Board Live Environment — clinical rehabilitation tool"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "hidapi>=0.14.0.post4",
    "numpy>=1.26,<3",
    "pythonnet==3.0.3",
    "dearpygui==2.1.1",
    "pytz",
    "tk",
    "typer>=0.26.7",
]

[project.optional-dependencies]
analysis = [
    "scipy>=1.13,<2",
    "plotly>=5.0",
    "jinja2>=3.1",
]
dev = [
    "commitizen>=4.0",
    "nuitka>=2.0",
    "pip-audit>=2.10",
    "pre-commit>=4.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
wiibble = "wiibble.__main__:app"
wiibble-report = "wiibble.cli.report:app"
wiibble-process-recordings = "wiibble.cli.process_recordings:app"
wiibble-session-report = "wiibble.cli.session_report:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv generates uv.lock from this file.
# To install:            uv sync
# To install dev extras: uv sync --extra dev
# To add a dependency:   uv add <package>
package = true

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["src/code_descriptors_postural_control"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/wiibble/cli/*.py" = ["B008"]
"src/wiibble/cli/report.py" = ["B008", "E501"]
"src/wiibble/session.py" = ["N806"]
"src/wiibble/ui/ui.py" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: marks tests that require live services or hardware", "analysis: posturographic pipeline tests (requires analysis extra)"]
addopts = [
    "--cov=wiibble.features.data_processing",
    "--cov=wiibble.utils.state",
    "--cov=wiibble.board.recording",
    "--cov=wiibble.session_actions",
    "--cov=wiibble.utils.recording_names",
    "--cov=wiibble.board.acquisition",
    "--cov=wiibble.board.exceptions",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "src/wiibble/__main__.py",
    "src/wiibble/app.py",
    "src/wiibble/session.py",
    "src/wiibble/ui/ui.py",
    "src/wiibble/ui/theme.py",
    "src/wiibble/ui/calibration_flow.py",
    "src/wiibble/board/board_connection.py",
    "src/wiibble/board/acquisition.py",
    "src/wiibble/board/mock_board.py",
    "src/wiibble/utils/resources.py",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.1.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = false
