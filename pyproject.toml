[project]
name = "wiibble"
version = "2.0.1"
description = "Wii Balance Board Live Environment — clinical rehabilitation tool"
readme = "ReadMe.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "hidapi>=0.14.0.post4",
    "numpy>=1.26,<3",
    "pythonnet==3.0.3",
    "dearpygui==2.1.1",
    "pytz",
    "tk",
    # Analysis pipeline (code_descriptors_postural_control transitive deps)
    "scipy==1.15.3",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "plotly>=5.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
analysis = [
    "scipy>=1.13,<2",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "statsmodels>=0.14.2",
]
dev = [
    "nuitka>=2.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
wiibble = "wiibble.__main__:main"
wiibble-report = "wiibble.cli.report:main"
wiibble-process-recordings = "wiibble.cli.process_recordings:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv generates uv.lock from this file.
# To install:            uv sync
# To install dev extras: uv sync --extra dev
# To add a dependency:   uv add <package>
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/code_descriptors_postural_control"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=wiibble.features.data_processing",
    "--cov=wiibble.utils.state",
    "--cov=wiibble.board.recording",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "src/wiibble/__main__.py",
    "src/wiibble/app.py",
    "src/wiibble/ui/ui.py",
    "src/wiibble/ui/theme.py",
    "src/wiibble/analysis/calibration.py",
    "src/wiibble/board/board_connection.py",
    "src/wiibble/board/mock_board.py",
    "src/wiibble/utils/resources.py",
]
