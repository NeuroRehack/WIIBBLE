name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dev dependencies
        run: just sync

      - name: Lint with ruff
        run: just lint

      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: Unit Tests (pytest + coverage)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dev dependencies
        run: just sync

      - name: Run tests with coverage
        run: just test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  dotnet:
    name: Build C# board library
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build WiiBalanceBoardLibrary
        run: dotnet build WiiBalanceBoardLibrary/WiiBalanceBoardLibrary.csproj -c Debug

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dev dependencies
        run: just sync

      - name: Audit dependencies
        run: just audit
