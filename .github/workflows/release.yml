name: Release

# Tag-driven releases from main. Bump pyproject.toml, merge to main, then:
#   git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish release
    runs-on: windows-latest
    # A full build takes ~2h: main app plus the session-report and THRIVE companions.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Add Inno Setup to PATH
        run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Resolve and verify version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $projectVersion = uv run python scripts/get_version.py
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version ($tagVersion) does not match pyproject.toml ($projectVersion). Bump pyproject.toml before tagging."
          }
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit on main."
          }
          "WIIBBLE_VERSION=$tagVersion" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: .\scripts\ci_build.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WIIBBLE ${{ env.WIIBBLE_VERSION }}
          generate_release_notes: true
          files: |
            installer_output/WIIBBLE-*-Setup.exe
            WIIBBLE-*-portable.zip
          fail_on_unmatched_files: true
