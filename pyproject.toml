[project]
name = "wiibble"
version = "0.1.0"
description = "Wii Balance Board Live Environment — clinical rehabilitation tool"
readme = "ReadMe.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

dependencies = [
    "hidapi>=0.14.0.post4",
    "numpy>=1.26,<3",
    "pythonnet==3.0.3",
    "dearpygui==2.1.1",
    "pytz",
    # FontAwesome 5 Solid TTF vendored at assets/fonts/fa-solid-900.ttf (OFL-1.1)
]

[project.optional-dependencies]
# Offline posturographic analysis — not compiled into the clinical executable.
# Install with: uv sync --extra analysis
# Run with:     python process_recordings.py
analysis = [
    "scipy>=1.13,<2",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "statsmodels>=0.14.2",
]
# Development extras — not needed on the clinical machine
dev = [
    "nuitka>=2.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

# No [build-system] section — WIIBBLE is a runnable application, not a
# distributable library. uv sync installs dependencies only, no wheel build.
# Run the app with: python main.py  or  python main.py --mock

[tool.uv]
# uv generates uv.lock from this file.
# To install:            uv sync
# To install dev extras: uv sync --extra dev
# To add a dependency:   uv add <package>

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["code_descriptors_postural_control"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, isort
ignore = ["E501"]               # line length handled separately

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=data_processing",
    "--cov=state",
    "--cov=recording",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
    "app.py",
    "ui.py",
    "theme.py",
    "calibration.py",
    "board_connection.py",
    "mock_board.py",
    "resources.py",
]