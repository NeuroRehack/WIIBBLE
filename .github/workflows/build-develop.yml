name: Build (develop)

# Manual QA builds — uploads artifacts, does not create a GitHub Release.
# Actions → Build (develop) → Run workflow → pick branch and profile.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "full = Thrive + in-app reports; lite = omit both companions and Settings"
        type: choice
        required: true
        default: full
        options:
          - full
          - lite

concurrency:
  group: build-develop-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows executable (${{ inputs.profile }})
    runs-on: windows-latest
    # A full build takes ~2h: main app plus the session-report and THRIVE companions.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Add Inno Setup to PATH
        run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Resolve version
        shell: pwsh
        run: |
          $version = uv run python scripts/get_version.py
          $sha = "${{ github.sha }}".Substring(0, 7)
          $profile = "${{ inputs.profile }}"
          "WIIBBLE_VERSION=$version" >> $env:GITHUB_ENV
          "ARTIFACT_LABEL=$version-dev-$sha-$profile" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        env:
          WIIBBLE_PROFILE: ${{ inputs.profile }}
        run: .\scripts\ci_build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wiibble-${{ env.ARTIFACT_LABEL }}
          path: |
            installer_output/WIIBBLE-*-Setup.exe
            WIIBBLE-*-portable.zip
          if-no-files-found: error
